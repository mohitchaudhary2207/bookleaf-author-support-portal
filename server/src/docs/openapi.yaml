openapi: 3.0.3
info:
  title: BookLeaf Author Support & Communication Portal API
  version: 1.0.0
  description: |
    REST API behind both the Author portal and the Admin portal.

    **Authentication** - `POST /auth/login` returns a JWT and also sets an httpOnly session cookie
    (used by the web app). API clients can send `Authorization: Bearer <token>` instead.

    **Roles** - `author` accounts can only see their own books and tickets (other authors' resources
    return `404`). `admin` accounts can access everything under `/admin` plus attachments.

    **Errors** - every error uses the same envelope:
    `{ "error": { "code": "VALIDATION_ERROR", "message": "...", "details": [...], "requestId": "..." } }`.
    Validation failures are `422` with per-field `details`; the API never returns a bare 500 for bad input.

    **Real-time** - `GET /events` is a Server-Sent Events stream. Events carry only ids
    (`ticketId`) - re-fetch the ticket through the normal endpoints.

    **AI** - classification, priority and draft replies are produced server-side. If the AI provider
    is unavailable, tickets are still created (rule-based triage) and drafts fall back to templates.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Books
  - name: Tickets (author)
  - name: Admin - tickets
  - name: Admin - AI
  - name: Admin - dashboard
  - name: System
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [ System ]
      summary: Liveness probe + AI availability
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /meta:
    get:
      tags: [ System ]
      summary: Enumerations used by the UI (categories, priorities, statuses, production stages, SLA hours)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Meta' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login:
    post:
      tags: [ Auth ]
      summary: Sign in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email, example: priya.sharma@email.com }
                password: { type: string, example: Author@123 }
      responses:
        '200':
          description: Signed in. Also sets the `bl_session` httpOnly cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '401': { description: Invalid email or password, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Too many attempts }
  /auth/logout:
    post:
      tags: [ Auth ]
      summary: Clear the session cookie
      security: []
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      tags: [ Auth ]
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /books:
    get:
      tags: [ Books ]
      summary: List books with royalty summary
      description: Authors receive their own books. Admins must pass `authorId` (otherwise an empty list is returned).
      parameters:
        - { name: authorId, in: query, required: false, schema: { type: string, example: AUTH001 }, description: Admin only. Ignored for authors. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Book' } }
                  summary: { $ref: '#/components/schemas/BookSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /books/{bookId}:
    get:
      tags: [ Books ]
      summary: One book
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, example: BK001 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets:
    post:
      tags: [ Tickets (author) ]
      summary: Submit a support query
      description: |
        Accepts JSON or `multipart/form-data` (with up to 3 `attachments`, 5 MB each: PNG, JPG, WEBP, PDF, TXT).
        The ticket is created immediately; AI classification + priority run in the background and the
        admin queue updates in real time. `bookId` is optional - omit it (or send `general`) for a
        General / Account Level query.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicket' }
          multipart/form-data:
            schema:
              allOf:
                - { $ref: '#/components/schemas/CreateTicket' }
                - type: object
                  properties:
                    attachments:
                      type: array
                      items: { type: string, format: binary }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorTicket' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Attachment too large }
        '422': { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [ Tickets (author) ]
      summary: My tickets (most recently updated first)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuthorTicket' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tickets/{id}:
    get:
      tags: [ Tickets (author) ]
      summary: One of my tickets with its public conversation (internal notes are never included)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorTicketDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tickets/{id}/messages:
    post:
      tags: [ Tickets (author) ]
      summary: Reply on my ticket (a reply on a Resolved ticket reopens it)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ body ]
              properties: { body: { type: string, minLength: 1, maxLength: 5000 } }
      responses:
        '201': { description: Updated ticket, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorTicketDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Ticket is closed }
        '422': { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tickets/{id}/close:
    post:
      tags: [ Tickets (author) ]
      summary: Close my ticket
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorTicketDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tickets/{id}/attachments/{attachmentId}:
    get:
      tags: [ Tickets (author) ]
      summary: Download an attachment (ticket owner or admin)
      parameters:
        - { $ref: '#/components/parameters/TicketId' }
        - { name: attachmentId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: File download, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events:
    get:
      tags: [ System ]
      summary: Server-Sent Events stream
      description: |
        Events: `ready`, `ticket.created`, `ticket.updated`, `ticket.message`, and (admins only)
        `ticket.triaged`, `ticket.note`. Payload: `{ ticketId, authorId, at }`. Authors only receive
        events for their own tickets.
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/tickets:
    get:
      tags: [ Admin - tickets ]
      summary: Ticket queue (default sort = urgency)
      description: |
        Default `sort=urgency` puts unresolved tickets first, ordered by priority (Critical > Low) and then
        oldest first. Each item includes `sla` (`overdue` = no first response within the target for its priority).
      parameters:
        - { name: status, in: query, schema: { type: string, example: 'Open,In Progress' }, description: Comma separated statuses }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: assignee, in: query, schema: { type: string, example: me }, description: '`me`, `unassigned` or an admin user id' }
        - { name: q, in: query, schema: { type: string }, description: "Search subject, description, author, book title or ticket number" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date }, description: Inclusive }
        - { name: sort, in: query, schema: { type: string, enum: [ urgency, oldest, newest, updated ], default: urgency } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminTicket' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalPages: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/tickets/{id}:
    get:
      tags: [ Admin - tickets ]
      summary: Full ticket - conversation, internal notes, audit trail, author profile and books
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTicketDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [ Admin - tickets ]
      summary: Update status, override AI category / priority, or (un)assign
      description: Overriding category or priority marks the field `source = admin`; a late AI result will never overwrite it. Every change is written to the audit trail.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: '#/components/schemas/Status' }
                category: { $ref: '#/components/schemas/Category' }
                priority: { $ref: '#/components/schemas/Priority' }
                assignedTo:
                  description: '`"me"` assigns to yourself, `null` unassigns, or an admin user id'
                  oneOf: [ { type: string, enum: [ me ] }, { type: integer, nullable: true } ]
              additionalProperties: false
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTicketDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/tickets/{id}/messages:
    post:
      tags: [ Admin - tickets ]
      summary: Send a reply to the author (visible in the author's ticket view)
      description: The first reply stamps `firstResponseAt`, auto-assigns the ticket to the sender if unassigned, and moves `Open` to `In Progress` unless `setStatus` says otherwise.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ body ]
              properties:
                body: { type: string, maxLength: 5000 }
                aiAssisted: { type: boolean, default: false, description: True when the reply started from an AI draft (analytics only) }
                setStatus: { type: string, enum: [ In Progress, Resolved ] }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTicketDetail' } } } }
        '409': { description: Ticket is closed }
        '422': { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/tickets/{id}/notes:
    post:
      tags: [ Admin - tickets ]
      summary: Add an internal note (never visible to the author)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ body ]
              properties: { body: { type: string, maxLength: 2000 } }
      responses:
        '201': { description: All internal notes for the ticket (newest first), content: { application/json: { schema: { $ref: '#/components/schemas/NotesResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/tickets/{id}/draft:
    get:
      tags: [ Admin - AI ]
      summary: Read the saved AI draft (never generates)
      description: |
        Strictly read-only: returns the draft already saved for this ticket, or **204** when none exists.
        It never calls the LLM and consumes no tokens, so opening a ticket is free. `stale: true` means the
        ticket, book or conversation changed after the draft was written - the admin decides whether to
        regenerate (`POST`); the server never does it silently.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: Saved draft, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '204': { description: No draft has been generated for this ticket yet }
        '409': { description: Ticket is closed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [ Admin - AI ]
      summary: Generate (or regenerate) an AI draft - explicit admin action
      description: |
        The only endpoint that produces a draft; the UI calls it when the admin clicks **Generate AI Response**.
        Built from the ticket, the referenced book's real data, computed royalty-cycle facts and only the
        knowledge-base sections relevant to the category, then passed through the quality gate. Concurrent
        requests for one ticket share a single LLM call. If the AI is unavailable the response is a clearly
        labelled **template** draft (`source: template`) - the endpoint still returns 200. Rate limited per admin.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '409': { description: Ticket is closed }
        '429': { description: Too many generations in a minute }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/tickets/{id}/reclassify:
    post:
      tags: [ Admin - AI ]
      summary: Re-run AI category + priority (replaces earlier admin overrides)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: Updated ticket, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTicketDetail' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/ai/status:
    get:
      tags: [ Admin - AI ]
      summary: "Is the AI currently usable? (reason is one of: disabled, not_configured, cooling_down; lastFailure explains why calls are paused)"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AiStatus' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/ai/usage:
    get:
      tags: [ Admin - AI ]
      summary: Token + latency usage log summary with an estimated spend (cost visibility)
      description: '`estimatedCostUsd` is computed from the token totals and the configurable list prices (`AI_PRICE_INPUT`, `AI_PRICE_OUTPUT`, `AI_PRICE_CACHE_READ`, USD per 1M tokens) - an estimate, not a bill.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AiUsage' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/stats:
    get:
      tags: [ Admin - dashboard ]
      summary: Queue statistics (open by priority/category, overdue, avg first response, ...)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/admins:
    get:
      tags: [ Admin - dashboard ]
      summary: Admin users (assignee choices)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/authors:
    get:
      tags: [ Admin - dashboard ]
      summary: All authors with their book count
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuthorSummary' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: bl_session }
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }
  responses:
    Unauthorized:
      description: Missing or invalid session
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Role not allowed for this endpoint
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found (also returned for other authors' resources)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties: { path: { type: string }, message: { type: string } }
            requestId: { type: string }
          required: [ code, message ]
      required: [ error ]
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        ai: { $ref: '#/components/schemas/AiStatus' }
        time: { type: string, format: date-time }
    Status: { type: string, enum: [ Open, In Progress, Resolved, Closed ] }
    Priority: { type: string, enum: [ Critical, High, Medium, Low ] }
    Category:
      type: string
      enum: [ Royalty & Payments, ISBN & Metadata Issues, Printing & Quality, Distribution & Availability, Book Status & Production Updates, General Inquiry ]
    Source: { type: string, enum: [ pending, ai, rules, admin ], description: 'Who set the value: the LLM, the keyword fallback, or a human override' }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [ author, admin ] }
        authorId: { type: string, nullable: true }
    Book:
      type: object
      properties:
        bookId: { type: string }
        title: { type: string }
        isbn: { type: string }
        genre: { type: string }
        publicationDate: { type: string, nullable: true }
        status: { type: string, example: Published & Live }
        isPublished: { type: boolean }
        productionStage: { type: string, nullable: true }
        productionStageIndex: { type: integer }
        mrp: { type: number, nullable: true }
        royaltyPerCopy: { type: number, nullable: true }
        totalCopiesSold: { type: integer }
        totalRoyaltyEarned: { type: number }
        royaltyPaid: { type: number }
        royaltyPending: { type: number }
        lastRoyaltyPayoutDate: { type: string, nullable: true }
        printPartner: { type: string, nullable: true }
        availableOn: { type: array, items: { type: string } }
    BookSummary:
      type: object
      properties:
        totalBooks: { type: integer }
        published: { type: integer }
        inProduction: { type: integer }
        totalCopiesSold: { type: integer }
        totalRoyaltyEarned: { type: number }
        totalRoyaltyPaid: { type: number }
        totalRoyaltyPending: { type: number }
    CreateTicket:
      type: object
      required: [ subject, description ]
      properties:
        bookId: { type: string, nullable: true, example: BK001, description: Omit or send "general" for General / Account Level }
        subject: { type: string, minLength: 3, maxLength: 150 }
        description: { type: string, minLength: 10, maxLength: 5000 }
    Message:
      type: object
      properties:
        id: { type: integer }
        senderRole: { type: string, enum: [ author, admin ] }
        senderName: { type: string }
        body: { type: string }
        aiAssisted: { type: boolean }
        createdAt: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { type: integer }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
    AuthorTicket:
      type: object
      properties:
        id: { type: integer }
        ticketNumber: { type: string, example: BL-00007 }
        subject: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        book: { type: object, nullable: true, properties: { bookId: { type: string }, title: { type: string } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        messageCount: { type: integer }
        lastSenderRole: { type: string, nullable: true }
        awaitingYourReply: { type: boolean }
    AuthorTicketDetail:
      type: object
      properties:
        ticket: { $ref: '#/components/schemas/AuthorTicket' }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
    AdminTicket:
      type: object
      properties:
        id: { type: integer }
        ticketNumber: { type: string }
        subject: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        category: { allOf: [ { $ref: '#/components/schemas/Category' } ], nullable: true }
        categorySource: { $ref: '#/components/schemas/Source' }
        priority: { allOf: [ { $ref: '#/components/schemas/Priority' } ], nullable: true }
        prioritySource: { $ref: '#/components/schemas/Source' }
        aiStatus: { type: string, enum: [ pending, done, fallback, failed ] }
        aiConfidence: { type: number, nullable: true }
        aiRationale: { type: string, nullable: true }
        author: { type: object, properties: { authorId: { type: string }, name: { type: string }, email: { type: string } } }
        book: { type: object, nullable: true, properties: { bookId: { type: string }, title: { type: string } } }
        assignedTo: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        firstResponseAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        messageCount: { type: integer }
        ageHours: { type: integer }
        sla:
          type: object
          properties:
            targetHours: { type: integer }
            dueAt: { type: string, format: date-time }
            waitingForFirstResponse: { type: boolean }
            overdue: { type: boolean }
    AdminTicketDetail:
      type: object
      properties:
        ticket: { $ref: '#/components/schemas/AdminTicket' }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        notes: { type: array, items: { type: object, properties: { id: { type: integer }, body: { type: string }, authorName: { type: string }, createdAt: { type: string } } } }
        activity: { type: array, items: { type: object, properties: { action: { type: string }, detail: { type: string, nullable: true }, actorName: { type: string }, createdAt: { type: string } } } }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        author: { type: object }
        books: { type: array, items: { $ref: '#/components/schemas/Book' } }
        selectedBook: { allOf: [ { $ref: '#/components/schemas/Book' } ], nullable: true }
    Draft:
      type: object
      properties:
        body: { type: string, description: "The draft reply, editable by the admin before sending" }
        source: { type: string, enum: [ ai, template ] }
        model: { type: string, nullable: true }
        notes: { type: array, items: { type: string }, description: Things the admin should verify before sending }
        generatedAt: { type: string, format: date-time }
        cached: { type: boolean, description: "True when read from storage; false when just generated" }
        stale: { type: boolean, description: "True when the ticket or conversation changed after this draft was written" }
        aiAvailable: { type: boolean }
    AiStatus:
      type: object
      required: [ available ]
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true, description: 'null when available; otherwise disabled | not_configured | cooling_down' }
        lastFailure:
          type: object
          nullable: true
          description: The most recent AI provider failure (kept while the circuit breaker is open so admins see the real cause).
          properties:
            reason: { type: string, enum: [ rate_limited, quota, timeout, unavailable, auth, refused, invalid_response ], description: Failure category - never contains credentials }
            at: { type: string, format: date-time }
    Meta:
      type: object
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        priorities: { type: array, items: { $ref: '#/components/schemas/Priority' } }
        statuses: { type: array, items: { $ref: '#/components/schemas/Status' } }
        productionStages: { type: array, items: { type: string } }
        sla:
          type: object
          description: First-response target in hours by priority
          additionalProperties: { type: integer }
          example: { Critical: 4, High: 24, Medium: 48, Low: 72 }
    NotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              body: { type: string }
              authorName: { type: string }
              adminId: { type: integer }
              createdAt: { type: string, format: date-time }
    Stats:
      type: object
      properties:
        byStatus: { type: object, additionalProperties: { type: integer } }
        openByPriority: { type: object, additionalProperties: { type: integer }, description: 'Keys are priorities; unscored tickets appear under "Pending"' }
        openByCategory: { type: object, additionalProperties: { type: integer } }
        totalOpen: { type: integer }
        unassignedOpen: { type: integer }
        overdue: { type: integer, description: Open tickets with no first reply past their SLA target }
        awaitingFirstResponse: { type: integer }
        createdLast7Days: { type: integer }
        resolvedLast7Days: { type: integer }
        avgFirstResponseHours: { type: number, nullable: true }
        needsTriageReview: { type: integer, description: Open tickets triaged by fallback rules or whose AI triage failed }
    AuthorSummary:
      type: object
      properties:
        author_id: { type: string, example: AUTH001 }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        city: { type: string, nullable: true }
        joined_date: { type: string, nullable: true }
        book_count: { type: integer }
    AiUsage:
      type: object
      properties:
        totals:
          type: object
          properties:
            calls: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            inputTokens: { type: integer, description: Uncached prompt tokens }
            outputTokens: { type: integer }
            cacheReadTokens: { type: integer, description: Prompt tokens served from the provider's prompt cache }
            avgLatencyMs: { type: number }
        byPurpose:
          type: array
          items:
            type: object
            properties:
              purpose: { type: string, enum: [ classify, draft ] }
              calls: { type: integer }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
        recentErrors:
          type: array
          items:
            type: object
            properties:
              createdAt: { type: string, format: date-time }
              purpose: { type: string }
              error: { type: string, description: 'Failure category and a generic message; never credentials' }
        estimatedCostUsd: { type: number, description: Estimated spend in USD from token totals x configured list prices, example: 0.0042 }
        status: { $ref: '#/components/schemas/AiStatus' }
